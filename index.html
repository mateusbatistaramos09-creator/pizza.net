<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzaria Online</title>
</head>
<body>
      <header>
        <h1>Pizzaria Online</h1>
        <p>Modelo de Domínio (UML) virando programa: monte um pedido e veja os objetos mudando ewm tempo real </p>
      </header>
      <main>
        <section>
            <h2>Cardápio</h2>
            <dv id="menu"></dv>
        </section>

        <section>
            <h2>Pedido</h2>
        <label>Cliente<input id="nome" placeholder="Nome"></label>
        <label>Endereço de Entrega<input id="rua" placeholder="Rua"></label>
        <label>Cidade<input id="cidade" placeholder="Cidade"></label>
        <h3>Itens</h3>
        <div id="itens" class="mut">Nenhum item ainda.</div>
        <div class="tot"><span>Total</span><span id="total">R$ 0,00</span></div>
        <label>Pagamento
        <select id="forma"><option>Pix</option><option>Cartão</option><option>Dinheiro</option></select></label>
        <button id="fin" style=""></button>
        </section>
      </main>
</body>
</html>
